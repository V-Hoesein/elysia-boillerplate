services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elysia
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d elysia']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    image: oven/bun:1.3.14
    working_dir: /app
    env_file: .env
    environment:
      NODE_ENV: development
      APP_HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/elysia
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - api-dependencies:/app/node_modules
    command: sh -c "bun install --frozen-lockfile && bun run db:migrate && bun run dev"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "const r=await fetch('http://localhost:3000/health/ready');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres-data:
  api-dependencies:
